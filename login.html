<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080a0f">
  <title>RPG HUB — Entrar</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Fallback visual da autenticação: mantém a tela bonita mesmo se a folha global falhar. */
    :root{--auth-bg:#07090d;--auth-panel:#0d1016;--auth-panel2:#121620;--auth-border:#252b36;--auth-text:#eef0f5;--auth-muted:#7f8797;--auth-accent:#9487ff;--auth-accent2:#6b5be7;--auth-danger:#fb7185}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body.authBody{min-height:100vh;color:var(--auth-text);background:radial-gradient(circle at 78% 8%,rgba(107,91,231,.18),transparent 34%),radial-gradient(circle at 12% 92%,rgba(148,135,255,.07),transparent 28%),var(--auth-bg);overflow-x:hidden}
    body.authBody:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 85%)}
    .authShell{min-height:100vh;display:grid;place-items:center;padding:88px 24px 40px;position:relative}
    .authBrand{position:absolute;top:28px;left:30px;display:flex;gap:9px;align-items:center;color:#dfe2e9;text-decoration:none;font-size:14px;z-index:2}
    .authBrand b{font-weight:800}
    .authBrand .brandMark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(148,135,255,.15);color:var(--auth-accent);box-shadow:0 0 25px rgba(148,135,255,.12);border:1px solid rgba(148,135,255,.18)}
    .authCard{width:min(460px,100%);border:1px solid rgba(255,255,255,.09);background:linear-gradient(180deg,rgba(18,22,32,.98),rgba(13,16,22,.98));padding:28px;border-radius:20px;box-shadow:0 35px 120px rgba(0,0,0,.55),0 0 0 1px rgba(148,135,255,.025);backdrop-filter:blur(18px)}
    .authHeader .eyebrow{font-size:9px;letter-spacing:.17em;color:#777f8e;display:flex;align-items:center;gap:8px}
    .authHeader .eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--auth-accent);box-shadow:0 0 12px rgba(148,135,255,.75)}
    .authHeader h1{font-size:29px;line-height:1.05;letter-spacing:-.04em;margin:12px 0 7px;color:var(--auth-text)}
    .authHeader p{margin:0;color:#70788a;font-size:12px;line-height:1.55}
    .authTabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#090c11;padding:4px;border:1px solid #202630;border-radius:12px;margin:23px 0 18px}
    .authTabs button{appearance:none;border:0;background:transparent;color:#737b8b;padding:10px;border-radius:8px;font-size:11px;cursor:pointer;transition:.18s}
    .authTabs button:hover{color:#bfc3ce;background:#11151d}
    .authTabs button.active{background:#1e1b32;color:#cec8ff;box-shadow:inset 0 0 0 1px rgba(148,135,255,.08)}
    .authCard form{display:grid;gap:13px}
    .authCard label{display:grid;gap:7px;color:#858d9d;font-size:10px}
    .authCard input,.authCard select{appearance:none;width:100%;padding:12px 13px;border:1px solid #2a303b;border-radius:10px;background:#090c11;color:#edf0f5;outline:none;transition:.18s}
    .authCard input::placeholder{color:#4f5766}
    .authCard input:hover,.authCard select:hover{border-color:#353c49}
    .authCard input:focus,.authCard select:focus{border-color:#6559a5;box-shadow:0 0 0 3px rgba(148,135,255,.1),0 0 24px rgba(148,135,255,.05)}
    .primaryButton.full{width:100%;margin-top:5px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 15px;border:1px solid var(--auth-accent);border-radius:11px;background:linear-gradient(135deg,var(--auth-accent),var(--auth-accent2));color:#fff;font-weight:750;font-size:12px;cursor:pointer;box-shadow:0 10px 28px rgba(107,91,231,.2);transition:.18s}
    .primaryButton.full:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 14px 36px rgba(107,91,231,.28)}
    .primaryButton.full:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .formMessage{min-height:19px;margin-top:12px;font-size:11px;line-height:1.5;color:#778090}
    .formMessage.error{color:#fb8b9c}.formMessage.success{color:#79ddb1}
    .authFoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.055);color:#626a78;font-size:10px}
    .authFoot a{color:#777f8d;text-decoration:none}.authFoot a:hover{color:#bcb5ff}
    .textButton{appearance:none;border:0;background:none;color:#a79fff;font-size:10px;padding:0;cursor:pointer}.textButton:hover{color:#c9c3ff}
    .authCreator{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;color:#5f6878;font-size:10px;letter-spacing:.02em;text-align:center}
    .authCreator .creatorMark{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--auth-accent);background:rgba(148,135,255,.1);border:1px solid rgba(148,135,255,.16);font-size:10px;box-shadow:0 0 18px rgba(148,135,255,.08)}
    .authCreator strong{color:#b8b0ff;font-weight:750}
    .authCreator .creatorDot{opacity:.45}
    .hidden{display:none!important}
    @media(max-width:560px){.authShell{padding:82px 15px 25px}.authBrand{top:20px;left:20px}.authCard{padding:22px 18px;border-radius:17px}.authHeader h1{font-size:25px}.authFoot{align-items:flex-start;flex-direction:column}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="supabase.js"></script>
  <script src="rpg-auth-hardening.js"></script>
</head>
<body class="authBody">
  <main class="authShell">
    <a class="brand authBrand" href="index.html"><span class="brandMark">✦</span><span>RPG <b>HUB</b></span></a>
    <section class="authCard">
      <div class="authHeader"><div class="eyebrow">ACESSO À CAMPANHA</div><h1 id="authTitle">Entrar no RPG HUB</h1><p id="authSubtitle">Entre para continuar sua campanha.</p></div>
      <div class="authTabs"><button id="loginTab" class="active" type="button">Entrar</button><button id="registerTab" type="button">Criar conta</button></div>
      <form id="authForm">
        <label id="displayNameField" class="hidden">Nome de exibição<input id="displayName" maxlength="80" placeholder="Como você quer aparecer na mesa?"></label>
        <label id="accountTypeField" class="hidden">Tipo de conta<select id="accountType"><option value="player" selected>Jogador</option><option value="master">Mestre</option></select><small>Você pode mudar esse tipo depois, no perfil.</small></label>
        <label>E-mail<input id="email" type="email" autocomplete="email" required placeholder="voce@email.com"></label>
        <label>Senha<input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••"></label>
        <button class="primaryButton full" id="submitBtn" type="submit"><span id="submitText">Entrar</span><span>→</span></button>
      </form>
      <div id="authMessage" class="formMessage" role="status"></div>
      <div class="authFoot"><a href="index.html">← Voltar para o início</a><button id="forgotBtn" class="textButton" type="button">Esqueci minha senha</button></div>
      <div class="authCreator" aria-label="Créditos do projeto"><span class="creatorMark">✦</span><span>Desenvolvido por <strong>Carlos Henrique</strong><span class="creatorDot"> · </span>RPG HUB</span></div>
    </section>
  </main>
  <script>
    (() => {
      const sb = window.rpgSupabase;
      let mode = new URLSearchParams(location.search).get('mode') === 'register' ? 'register' : 'login';
      const $ = id => document.getElementById(id);
      const render = () => {
        const isRegister = mode === 'register';
        $('loginTab').classList.toggle('active', !isRegister); $('registerTab').classList.toggle('active', isRegister);
        $('displayNameField').classList.toggle('hidden', !isRegister); $('accountTypeField').classList.toggle('hidden', !isRegister);
        $('authTitle').textContent = isRegister ? 'Criar sua conta' : 'Entrar no RPG HUB';
        $('authSubtitle').textContent = isRegister ? 'Crie sua identidade e entre na primeira campanha.' : 'Entre para continuar sua campanha.';
        $('submitText').textContent = isRegister ? 'Criar conta' : 'Entrar';
      };
      $('loginTab').onclick = () => { mode='login'; render(); };
      $('registerTab').onclick = () => { mode='register'; render(); };
      $('authForm').onsubmit = async e => {
        e.preventDefault();
        const email=$('email').value.trim(), password=$('password').value, display=$('displayName').value.trim(), accountType=$('accountType').value;
        $('submitBtn').disabled=true; $('authMessage').className='formMessage'; $('authMessage').textContent='Processando…';
        try {
          if (mode==='register') {
            const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:display,account_type:accountType}}});
            if(error) throw error;
            if(data.session){ location.href='mesa.html'; return; }
            $('authMessage').classList.add('success'); $('authMessage').textContent='Conta criada. Confira seu e-mail para confirmar o acesso.';
          } else {
            const {data,error}=await sb.auth.signInWithPassword({email,password});
            if(error) throw error;
            if(data.session) location.href='mesa.html';
          }
        } catch(err) { $('authMessage').classList.add('error'); $('authMessage').textContent=err.message || 'Não foi possível concluir o acesso.'; }
        finally { $('submitBtn').disabled=false; }
      };
      $('forgotBtn').onclick=async()=>{
        const email=$('email').value.trim(); if(!email){$('authMessage').className='formMessage error';$('authMessage').textContent='Digite seu e-mail primeiro.';return;}
        const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
        $('authMessage').className='formMessage '+(error?'error':'success'); $('authMessage').textContent=error?.message || 'Se o e-mail existir, o link de redefinição foi enviado.';
      };
      sb.auth.getSession().then(({data})=>{if(data.session) location.href='mesa.html';});
      render();
    })();
  </script>
</body>
</html>
